services:
  db:
    image: postgres:16-alpine
    container_name: ridex-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ridex
      POSTGRES_PASSWORD: ridex_dev_password
      POSTGRES_DB: ridex
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ridex_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ridex -d ridex"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: ridex-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ridex:ridex_dev_password@db:5432/ridex?schema=public
      PORT: 3000
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/src/server.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  ridex_data:
